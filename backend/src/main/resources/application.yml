server:
  port: ${ARARA_PORT:8080}
  compression:                     # geo.json (1,1 MB) e os scripts do globo viajam comprimidos
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 2048
spring:
  application:
    name: arara
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  # PostgreSQL do docker-compose.yml (docker compose up -d). Usuário e senha só no .env.
  datasource:
    url: ${ARARA_DB_URL:jdbc:postgresql://localhost:${ARARA_DB_PORT:5432}/arara}
    username: ${ARARA_DB_USER:arara}
    password: ${ARARA_DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  cache:
    cache-names: scenes
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

arara:
  # caminhos relativos à pasta backend/ (./mvnw -f backend spring-boot:run roda de lá)
  data-dir: ${ARARA_DATA_DIR:../data}
  pipeline-dir: ${ARARA_PIPELINE_DIR:../pipeline}
  frontend-dir: ${ARARA_FRONTEND_DIR:../frontend}
  python: ${ARARA_PYTHON:../.venv/bin/python}
  algorithm-version: arara-water-0.3.0
  asf-url: https://api.daac.asf.alaska.edu/services/search/param
  aoi-max-km2: ${ARARA_AOI_MAX_KM2:2500}
  max-scenes: ${ARARA_MAX_SCENES:12}
  retention-days: ${ARARA_RETENTION_DAYS:7}
  disk-limit-mb: ${ARARA_DISK_LIMIT_MB:4096}
  pipeline-timeout-minutes: ${ARARA_PIPELINE_TIMEOUT_MIN:60}
  # monitor das regiões (frontend/globe/regioes.json) e desempenho da pipeline
  monitor:
    enabled: ${ARARA_MONITOR:true}
    interval-minutes: ${ARARA_MONITOR_INTERVAL_MIN:360}
    regions-file: globe/regioes.json
    cache-max-mb: ${ARARA_CACHE_MAX_MB:8192}
    read-workers: ${ARARA_READ_WORKERS:3}
  # credenciais: só do ambiente / .env; nunca vão para log, resposta da API ou repositório
  earthdata-username: ${EARTHDATA_USERNAME:}
  earthdata-password: ${EARTHDATA_PASSWORD:}

resilience4j:
  retry:
    instances:
      asf:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      asf:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s

logging:
  level:
    root: INFO
